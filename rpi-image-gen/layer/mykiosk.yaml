# METABEGIN
# X-Env-Layer-Name: amp-server
# X-Env-Layer-Category: ampersand
# X-Env-Layer-Desc: Ampersand Server, Bruce MacKinnon KC1FSZ
# X-Env-Layer-Requires: rpi-user-credentials,systemd-net-min,systemd-timesyncd
#
# X-Env-VarPrefix: amp
#
# X-Env-Var-url: https://example.com
# X-Env-Var-url-Desc: Default URL the web kiosk will load at startup.
# X-Env-Var-url-Required: n
# X-Env-Var-url-Valid: regex:^https://[a-zA-Z0-9.-]+[a-zA-Z0-9]/?.*$
# X-Env-Var-url-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - wget 
    - net-tools 
    - iproute2
    - libcurl4-gnutls-dev
    - avahi-daemon 
    - libnss-mdns
  customize-hooks:
    - |
      export AMP_SERVER_VERSION=20260601
      export AMP_ARCH=$(uname -m)
      rm -f amp-${AMP_SERVER_VERSION}-${AMP_ARCH}.tar.gz
      wget https://ampersand-asl.s3.us-west-1.amazonaws.com/releases/amp-${AMP_SERVER_VERSION}-${AMP_ARCH}.tar.gz
      rm -rf amp-${AMP_SERVER_VERSION}-${AMP_ARCH}
      tar xvf amp-${AMP_SERVER_VERSION}-${AMP_ARCH}.tar.gz
      cp amp-${AMP_SERVER_VERSION}-${AMP_ARCH}/amp-server $1/usr/bin
      chroot "$1" sh -c "if ! id -u amp >/dev/null 2>&1; then \
        useradd --system --no-create-home --shell /usr/sbin/nologin amp; \
      fi"
      cp 99-cm108-ampersand.rules $1/etc/udev/rules.d/99-cm108-ampersand.rules


    